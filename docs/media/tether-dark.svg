<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300">
<defs>
<linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#182544"/></linearGradient>
<clipPath id="clipd"><rect width="1280" height="300" rx="20"/></clipPath>
<style>
.title{font:800 84px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:-2px}
.sub{font:500 26px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.pill{font:600 17px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.h{font:700 22px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.b{font:500 16px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.s{font:600 13px 'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;letter-spacing:.6px}
.m{font:600 14px 'JetBrains Mono','Fira Code',Menlo,Consolas,monospace}

.net{animation:net 10s ease-in-out infinite}.lost{animation:lost 10s ease-in-out infinite}
@keyframes net{0%,30%{opacity:1}36%,78%{opacity:.15}84%,100%{opacity:1}}
@keyframes lost{0%,30%{opacity:0}36%,78%{opacity:1}84%,100%{opacity:0}}

</style>
</defs>
<g clip-path="url(#clipd)"><rect width="1280" height="300" fill="url(#bgd)"/>
<text x="48" y="56" class="s" fill="#6f7b99">INTERNET BACKUP THROUGH YOUR PHONE</text>
<rect x="48" y="84" width="1184" height="160" rx="18" fill="#1b2031" stroke="#2f3852" stroke-width="1.5"/>
<g transform="translate(150,164)"><g transform="translate(0,0)" fill="none" stroke="#3daee9" stroke-width="2.8" stroke-linecap="round"><path d="M-16 -4 A23 23 0 0 1 16 -4"/><path d="M-10 3 A14 14 0 0 1 10 3"/><circle cx="0" cy="11" r="2.6" fill="#3daee9"/></g></g>
<text x="150" y="222" text-anchor="middle" class="b" fill="#aab6d3">Wi-Fi or Ethernet</text>
<g class="lost"><path d="M130 140 L170 180 M170 140 L130 180" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(640,160) scale(1.6)"><rect x="-24" y="-18" width="48" height="31" rx="4" fill="none" stroke="#f4f7ff" stroke-width="2.6"/><path d="M-8 22 H8 M0 13 V22" stroke="#f4f7ff" stroke-width="2.6" stroke-linecap="round"/></g>
<text x="640" y="222" text-anchor="middle" class="b" fill="#aab6d3">Your PC</text>
<g transform="translate(1130,160) scale(1.4)"><rect x="-13" y="-22" width="26" height="44" rx="5" fill="none" stroke="#3ddc84" stroke-width="2.6"/><rect x="-5" y="15" width="10" height="2.6" rx="1.3" fill="#3ddc84"/></g>
<text x="1130" y="222" text-anchor="middle" class="b" fill="#aab6d3">Plugged-in phone</text>
<g class="net"><path d="M196 160 L580 160" fill="none" stroke="#2f3852" stroke-width="3.5999999999999996" stroke-linecap="round"/>
<circle r="4" fill="#3daee9"><animateMotion dur="1.4s" begin="-0.00s" repeatCount="indefinite" path="M196 160 L580 160"/></circle>
<circle r="4" fill="#3daee9"><animateMotion dur="1.4s" begin="-0.47s" repeatCount="indefinite" path="M196 160 L580 160"/></circle>
<circle r="4" fill="#3daee9"><animateMotion dur="1.4s" begin="-0.93s" repeatCount="indefinite" path="M196 160 L580 160"/></circle></g>
<g class="lost"><path d="M1090 160 L700 160" fill="none" stroke="#2f3852" stroke-width="3.5999999999999996" stroke-linecap="round"/>
<circle r="4" fill="#3ddc84"><animateMotion dur="1.4s" begin="-0.00s" repeatCount="indefinite" path="M1090 160 L700 160"/></circle>
<circle r="4" fill="#3ddc84"><animateMotion dur="1.4s" begin="-0.47s" repeatCount="indefinite" path="M1090 160 L700 160"/></circle>
<circle r="4" fill="#3ddc84"><animateMotion dur="1.4s" begin="-0.93s" repeatCount="indefinite" path="M1090 160 L700 160"/></circle><g transform="translate(895,126)"><rect x="-86" y="-16" width="172" height="32" rx="16" fill="#3ddc84" opacity=".16"/><text y="6" text-anchor="middle" class="pill" fill="#3ddc84">USB tethering on</text></g></g>
<text x="48" y="280" class="b" fill="#aab6d3">Lose your network and the phone shares its connection over the cable. When a real network comes back, tethering switches off again.</text>
</g></svg>