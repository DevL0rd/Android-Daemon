<text x="392" y="130" class="h" fill="#10172a">adb server</text>
<text x="392" y="152" class="m" fill="#8391ad">linux-android-adb</text>
<text x="392" y="176" class="b" fill="#4a5775">Keeps one steady connection</text>
<text x="392" y="197" class="b" fill="#4a5775">to every phone</text>
<rect x="370" y="226" width="370" height="170" rx="14" fill="#ffffff" stroke="#cfd9ea" stroke-width="1.5"/>
<rect x="370" y="242" width="4" height="138" rx="2" fill="#1d99f3"/>
<text x="392" y="260" class="h" fill="#10172a">Phone daemon</text>
<text x="392" y="282" class="m" fill="#1d99f3">linux-android-daemon</text>
<text x="392" y="306" class="b" fill="#4a5775">Arms wireless ADB, follows USB ⇄ Wi-Fi,</text>
<text x="392" y="327" class="b" fill="#4a5775">owns the one screen mirror, unlocks,</text>
<text x="392" y="348" class="b" fill="#4a5775">tethers when your internet drops,</text>
<text x="392" y="369" class="b" fill="#4a5775">forwards KDE Connect notifications</text>
<rect x="370" y="416" width="370" height="110" rx="14" fill="#ffffff" stroke="#cfd9ea" stroke-width="1.5"/>
<rect x="370" y="432" width="4" height="78" rx="2" fill="#8a5cd6"/>
<text x="392" y="450" class="h" fill="#10172a">Webcam daemon</text>
<text x="392" y="472" class="m" fill="#8a5cd6">linux-phonecam</text>
<text x="392" y="496" class="b" fill="#4a5775">Wakes the phone camera only</text>
<text x="392" y="517" class="b" fill="#4a5775">while something is watching</text>
<rect x="850" y="96" width="382" height="118" rx="14" fill="#ffffff" stroke="#cfd9ea" stroke-width="1.5"/>
<rect x="850" y="112" width="4" height="86" rx="2" fill="#1d99f3"/>
<text x="872" y="130" class="h" fill="#10172a">Phone Screen</text>
<text x="872" y="152" class="m" fill="#1d99f3">desktop widget</text>
<text x="872" y="176" class="b" fill="#4a5775">A live, touchable mirror pinned</text>
<text x="872" y="197" class="b" fill="#4a5775">on your desktop</text>
<rect x="850" y="234" width="382" height="118" rx="14" fill="#ffffff" stroke="#cfd9ea" stroke-width="1.5"/>
<rect x="850" y="250" width="4" height="86" rx="2" fill="#1d99f3"/>
<text x="872" y="268" class="h" fill="#10172a">Phone Manager</text>
<text x="872" y="290" class="m" fill="#1d99f3">tray widget</text>
<text x="872" y="314" class="b" fill="#4a5775">Mirror, webcam and settings</text>
<text x="872" y="335" class="b" fill="#4a5775">in your system tray</text>
<rect x="850" y="372" width="382" height="154" rx="14" fill="#ffffff" stroke="#cfd9ea" stroke-width="1.5"/>
<rect x="850" y="388" width="4" height="122" rx="2" fill="#8a5cd6"/>
<text x="872" y="406" class="h" fill="#10172a">Phone Camera</text>
<text x="872" y="428" class="m" fill="#8a5cd6">v4l2loopback</text>
<text x="872" y="452" class="b" fill="#4a5775">/dev/video9, a normal webcam</text>
<text x="872" y="473" class="b" fill="#4a5775">for OBS, browsers, Discord,</text>
<text x="872" y="494" class="b" fill="#4a5775">video calls and anything else</text>
